 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المباراة - الدوري المصري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← رجوع</a>
        
        <div class="header">
            <h1>⚽ المباراة المباشرة</h1>
            <p id="matchInfo">جارٍ التحميل...</p>
        </div>
        
        <!-- النتيجة -->
        <div class="match-container">
            <div class="score-board">
                <div class="team-display">
                    <div class="logo" id="homeLogo">-</div>
                    <div class="name" id="homeName">-</div>
                </div>
                <div class="score-display">
                    <span id="homeScore">0</span> - <span id="awayScore">0</span>
                </div>
                <div class="team-display">
                    <div class="logo" id="awayLogo">-</div>
                    <div class="name" id="awayName">-</div>
                </div>
            </div>
            
            <!-- الوقت -->
            <div class="match-time" id="matchTime">الدقيقة 0</div>
            
            <!-- الأحداث -->
            <div class="match-events" id="matchEvents">
                <div class="event-item">المباراة لم تبدأ بعد...</div>
            </div>
            
            <!-- الأزرار -->
            <div class="match-controls">
                <button class="control-btn" id="startBtn">بدء المباراة</button>
                <button class="control-btn secondary" id="simBtn">محاكاة سريعة</button>
                <button class="control-btn" id="nextBtn" style="display: none;">المباراة التالية</button>
                <button class="control-btn secondary" id="tableBtn" style="display: none;">الجدول</button>
            </div>
        </div>
    </div>
    
    <script src="js/data.js"></script>
    <script>
        const gameState = JSON.parse(localStorage.getItem('egyptianLeague'));
        
        if (!gameState) {
            window.location.href = 'index.html';
        }
        
        let matchRunning = false;
        let currentMinute = 0;
        let homeGoals = 0;
        let awayGoals = 0;
        let events = [];
        
        const fixture = FIXTURES[gameState.matchNumber];
        const isHome = fixture.home === gameState.team;
        const opponentId = isHome ? fixture.away : fixture.home;
        const opponent = TEAMS[opponentId];
        const myTeam = TEAMS[gameState.team];
        
        // عرض معلومات المباراة
        document.getElementById('matchInfo').textContent = 
            `الجولة ${gameState.matchNumber + 1} - ${isHome ? 'داخل' : 'خارج'} الملعب`;
        
        // عرض الفرق
        document.getElementById('homeName').textContent = isHome ? myTeam.name : opponent.name;
        document.getElementById('awayName').textContent = isHome ? opponent.name : myTeam.name;
        
        document.getElementById('homeLogo').style.background = isHome ? myTeam.color : opponent.color;
        document.getElementById('homeLogo').textContent = isHome ? myTeam.name[0] : opponent.name[0];
        document.getElementById('awayLogo').style.background = isHome ? opponent.color : myTeam.color;
        document.getElementById('awayLogo').textContent = isHome ? opponent.name[0] : myTeam.name[0];
        
        // بدء المباراة
        document.getElementById('startBtn').addEventListener('click', startMatch);
        document.getElementById('simBtn').addEventListener('click', simulateQuick);
        document.getElementById('nextBtn').addEventListener('click', () => location.reload());
        document.getElementById('tableBtn').addEventListener('click', () => window.location.href = 'league.html');
        
        function startMatch() {
            matchRunning = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('simBtn').style.display = 'none';
            document.getElementById('matchEvents').innerHTML = '';
            
            const interval = setInterval(() => {
                currentMinute++;
                document.getElementById('matchTime').textContent = `الدقيقة ${currentMinute}`;
                
                // توليد حدث عشوائي
                if (Math.random() > 0.85) {
                    generateEvent();
                }
                
                // نهاية المباراة
                if (currentMinute >= 90) {
                    clearInterval(interval);
                    endMatch();
                }
            }, 500); // كل نصف ثانية = دقيقة
        }
        
        function generateEvent() {
            const team = Math.random() > 0.5 ? 'home' : 'away';
            const isMyTeam = (team === 'home' && isHome) || (team === 'away' && !isHome);
            
            // احتمالية الهدف
            if (Math.random() > 0.7) {
                if (team === 'home') {
                    homeGoals++;
                    document.getElementById('homeScore').textContent = homeGoals;
                } else {
                    awayGoals++;
                    document.getElementById('awayScore').textContent = awayGoals;
                }
                
                const scorer = isMyTeam ? getRandomPlayer() : `لاعب ${opponent.name}`;
                addEvent(currentMinute, `⚽ هدف! ${scorer}`, 'goal');
            } else {
                const eventText = MATCH_EVENTS[Math.floor(Math.random() * MATCH_EVENTS.length)]
                    .replace('{team}', isMyTeam ? myTeam.name : opponent.name)
                    .replace('{player}', isMyTeam ? getRandomPlayer() : 'اللاعب');
                addEvent(currentMinute, eventText, 'normal');
            }
        }
        
        function addEvent(minute, text, type) {
            const div = document.createElement('div');
            div.className = 'event-item';
            div.innerHTML = `<span class="event-time">${minute}</span> ${text}`;
            if (type === 'goal') div.classList.add('event-goal');
            
            document.getElementById('matchEvents').prepend(div);
        }
        
        function getRandomPlayer() {
            const lineup = gameState.lineup.map(id => myTeam.players.find(p => p.id === id)).filter(p => p);
            if (lineup.length === 0) return 'اللاعب';
            return lineup[Math.floor(Math.random() * lineup.length)].name;
        }
        
        function simulateQuick() {
            // محاكاة فورية
            const myPower = calculatePower();
            const oppPower = opponent.power;
            
            let myGoals = Math.floor(Math.random() * (myPower / 15));
            let oppGoals = Math.floor(Math.random() * (oppPower / 15));
            
            if (Math.random() > 0.6) myGoals++;
            
            homeGoals = isHome ? myGoals : oppGoals;
            awayGoals = isHome ? oppGoals : myGoals;
            
            document.getElementById('homeScore').textContent = homeGoals;
            document.getElementById('awayScore').textContent = awayGoals;
            document.getElementById('matchTime').textContent = 'نهاية المباراة';
            
            // أحداث سريعة
            document.getElementById('matchEvents').innerHTML = '';
            for (let i = 0; i < homeGoals; i++) {
                addEvent(10 + i * 30, `⚽ هدف للـ ${document.getElementById('homeName').textContent}`, 'goal');
            }
            for (let i = 0; i < awayGoals; i++) {
                addEvent(20 + i * 25, `⚽ هدف للـ ${document.getElementById('awayName').textContent}`, 'goal');
            }
            
            endMatch();
        }
        
        function calculatePower() {
            const lineup = gameState.lineup.map(id => myTeam.players.find(p => p.id === id)).filter(p => p);
            if (lineup.length === 0) return myTeam.power;
            return lineup.reduce((sum, p) => sum + p.rating, 0) / lineup.length;
        }
        
        function endMatch() {
            matchRunning = false;
            
            const myGoals = isHome ? homeGoals : awayGoals;
            const oppGoals = isHome ? awayGoals : homeGoals;
            
            // تحديث الجدول
            updateTable(gameState.team, myGoals, oppGoals);
            updateTable(opponentId, oppGoals, myGoals);
            
            // النقاط
            if (myGoals > oppGoals) {
                gameState.points += 3;
                addEvent(90, '🏆 فوز! +3 نقاط', 'goal');
            } else if (myGoals === oppGoals) {
                gameState.points += 1;
                addEvent(90, '🤝 تعادل! +1 نقطة', 'normal');
            } else {
                addEvent(90, '❌ خسارة', 'normal');
            }
            
            // المكافأة المالية
            const prize = Math.floor(myGoals * 0.5 + (myGoals > oppGoals ? 2 : 0));
            gameState.budget += prize;
            
            gameState.matchNumber++;
            localStorage.setItem('egyptianLeague', JSON.stringify(gameState));
            
            document.getElementById('nextBtn').style.display = 'block';
            document.getElementById('tableBtn').style.display = 'block';
            
            if (gameState.matchNumber >= FIXTURES.length) {
                addEvent(90, '🎉 انتهى الموسم! أبطال الدوري', 'goal');
            }
        }
        
        function updateTable(teamId, gf, ga) {
            if (!gameState.table[teamId]) {
                gameState.table[teamId] = { played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, points: 0 };
            }
            const record = gameState.table[teamId];
            record.played++;
            record.gf += gf;
            record.ga += ga;
            
            if (gf > ga) {
                record.won++;
                record.points += 3;
            } else if (gf === ga) {
                record.drawn++;
                record.points += 1;
            } else {
                record.lost++;
            }
        }
    </script>
</body>
</html>
