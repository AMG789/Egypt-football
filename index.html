<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مخاور دار الأصالة | فخامة إماراتية</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--p:#0E5E4F;--g:#C9A86B;--bg:#F5EFE6}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:#1f2937}
.editable[contenteditable="true"]{outline:2px dashed var(--g);outline-offset:4px}
</style>
</head>
<body>
<!-- شريط المالك -->
<div id="bar" class="hidden fixed top-0 inset-x-0 z-50 bg-white/90 backdrop-blur border-b p-2 text-sm">
 <div class="max-w-7xl mx-auto flex gap-3 items-center">
  <b class="text-[var(--p)]">لوحة المالك</b>
  <label class="flex items-center gap-1"><input id="edit" type="checkbox"> تعديل مباشر</label>
  <button id="panelBtn" class="px-3 py-1 rounded-full hover:bg-zinc-100">لوحة تحكم</button>
  <button id="save" class="px-3 py-1 rounded-full bg-[var(--p)] text-white">حفظ</button>
  <button id="out" class="mr-auto text-red-600">خروج</button>
 </div>
</div>

<header class="sticky top-0 z-40 bg-[var(--bg)]/80 backdrop-blur border-b">
 <div class="max-w-7xl mx-auto p-4 flex justify-between items-center">
  <div class="flex gap-3 items-center"><div class="w-10 h-10 grid place-items-center bg-[var(--p)] text-white rounded-2xl font-black">د</div><div class="font-black text-xl text-[var(--p)]">مخاور دار الأصالة</div><div class="text-xs opacity-60">كلباء • منذ 2015</div></div></div>
  <a href="#shop" class="bg-[var(--p)] text-white px-5 py-2 rounded-full font-bold">تسوقي</a>
 </div>
</header>

<section class="max-w-7xl mx-auto px-4 py-16 grid lg:grid-cols-2 gap-10 items-center">
 <div>
  <h1 id="t1" class="editable text-5xl font-black text-[var(--p)] leading-tight">فخامة المخور الإماراتي من كلباء إلى العالم</h1>
  <p id="t2" class="editable mt-5 text-xl opacity-80">ننسج الأصالة بخيوط الفخامة. مخاور مطرزة يدوياً بأجود الحرير.</p>
  <div class="mt-8 flex gap-3"><a href="#shop" class="bg-[var(--p)] text-white px-7 py-3 rounded-full font-bold">استكشفي</a><a id="wa1" target="_blank" class="border-2 border-[var(--g)] px-7 py-3 rounded-full font-bold text-[var(--p)]">واتساب</a></div>
 </div>
 <img src="https://images.unsplash.com/photo-1594739299330-6bf9c96d3e83?q=80&w=1200" class="w-full h-[500px] object-cover rounded-[2rem] shadow-2xl">
</section>

<section id="shop" class="py-16 bg-white/60 border-y"><div class="max-w-7xl mx-auto px-4"><h2 class="text-3xl font-black text-[var(--p)] mb-8">تشكيلتنا</h2><div id="grid" class="grid md:grid-cols-3 gap-8"></div></div></section>

<footer class="py-10 text-center"><button id="loginBtn" class="text-xs opacity-40 hover:opacity-100 underline">دخول المالك</button><div class="mt-2 opacity-60 text-sm">© 2025 مخاور دار الأصالة</div></footer>

<!-- مودال دخول -->
<div id="login" class="hidden fixed inset-0 z-[100] bg-black/70 grid place-items-center p-4"><div class="bg-[var(--bg)] p-8 rounded-3xl w-full max-w-sm text-center"><h3 class="text-2xl font-black mb-4">دخول المالك</h3><input id="pw" type="password" class="w-full p-3 border rounded-xl text-center" placeholder="••••••••"><button id="go" class="w-full mt-3 bg-[var(--p)] text-white py-3 rounded-xl font-bold">دخول</button><p class="text-xs opacity-50 mt-3">الافتراضية: makhawir2026</p></div></div>

<!-- لوحة تحكم -->
<div id="panel" class="hidden fixed inset-0 z-[90] bg-black/50 p-4 overflow-auto"><div class="bg-[var(--bg)] max-w-4xl mx-auto rounded-3xl p-6"><div class="flex justify-between mb-4"><h3 class="font-black text-xl">لوحة تحكم</h3><button id="closeP" class="text-2xl">×</button></div><div class="grid md:grid-cols-2 gap-6"><div><h4 class="font-bold mb-2">إضافة منتج</h4><input id="pn" placeholder="الاسم" class="w-full p-2 border rounded mb-2"><input id="pp" type="number" placeholder="السعر" class="w-full p-2 border rounded mb-2"><input id="pi" placeholder="رابط الصورة" class="w-full p-2 border rounded mb-2"><button id="add" class="w-full bg-[var(--p)] text-white py-2 rounded">إضافة</button><div id="list" class="mt-4 space-y-2 max-h-60 overflow-auto"></div></div><div><h4 class="font-bold mb-2">الإعدادات</h4><label class="text-sm">واتساب (971...)</label><input id="wa" class="w-full p-2 border rounded mb-3" dir="ltr"><label class="text-sm">لون أساسي</label><input id="cp" type="color" class="w-full h-10 rounded mb-3"></div></div></div></div>

<script src="assets/app.js"></script>
</body>
</html>
