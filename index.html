<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مخاور دار الأصالة</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo',sans-serif;background:#F5EFE6}
.editable:focus{outline:2px dashed #C9A86B}
</style>
</head>
<body>
<header class="p-4 bg-white/80 backdrop-blur sticky top-0 shadow-sm">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="font-black text-2xl text-emerald-800">مخاور دار الأصالة</h1>
    <button id="owner-login-link" class="text-xs opacity-40 hover:opacity-100">دخول المالك</button>
  </div>
</header>

<main class="max-w-6xl mx-auto p-6">
  <h2 id="hero-title" class="editable text-4xl md:text-5xl font-black text-emerald-900">فخامة المخور الإماراتي من كلباء إلى العالم</h2>
  <p id="hero-subtitle" class="editable mt-4 text-lg opacity-80 max-w-2xl">ننسج الأصالة بخيوط الفخامة. مخاور مطرزة يدوياً.</p>

  <div id="products-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-12"></div>
</main>

<!-- مودال الدخول -->
<div id="login-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur grid place-items-center z-50 p-4">
  <div class="bg-[#F5EFE6] p-7 rounded-3xl w-full max-w-sm shadow-2xl">
    <h3 class="text-xl font-black text-center mb-4">دخول المالك</h3>
    <input id="password-input" type="password" placeholder="كلمة المرور" class="w-full p-3 border rounded-xl text-center">
    <button id="login-btn" class="w-full mt-3 bg-emerald-800 text-white py-3 rounded-xl font-bold">دخول</button>
    <p class="text-[11px] text-center mt-3 opacity-50">الافتراضية: makhawir2026</p>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
