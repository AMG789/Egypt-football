 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدوري المصري - المدير الفني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ الدوري المصري</h1>
            <p>الموسم 2024-2025 - المدير الفني</p>
        </div>
        
        <div id="gameStats" class="stats-bar" style="display: none;">
            <div class="stat-item">
                <div class="stat-value" id="matchNumber">0</div>
                <div class="stat-label">المباريات</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="points">0</div>
                <div class="stat-label">النقاط</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="budget">10</div>
                <div class="stat-label">مليون $</div>
            </div>
        </div>
        
        <div id="teamSelection" class="team-select">
            <h2>اختر فريقك</h2>
            <div class="teams-grid">
                <div class="team-card" data-team="ahly" data-power="85">
                    <div class="team-logo ahly">A</div>
                    <div class="team-name">الأهلي</div>
                    <div class="team-power">⭐ 85</div>
                </div>
                <div class="team-card" data-team="zamalek" data-power="83">
                    <div class="team-logo zamalek">Z</div>
                    <div class="team-name">الزمالك</div>
                    <div class="team-power">⭐ 83</div>
                </div>
                <div class="team-card" data-team="pyramids" data-power="80">
                    <div class="team-logo pyramids">P</div>
                    <div class="team-name">بيراميدز</div>
                    <div class="team-power">⭐ 80</div>
                </div>
                <div class="team-card" data-team="ismaily" data-power="78">
                    <div class="team-logo ismaily">I</div>
                    <div class="team-name">الإسماعيلي</div>
                    <div class="team-power">⭐ 78</div>
                </div>
            </div>
            <button class="start-btn" id="startBtn" disabled>ابدأ الموسم</button>
        </div>
        
        <div id="mainMenu" class="menu-grid" style="display: none;">
            <a href="team.html" class="menu-btn">
                <div class="menu-icon">👥</div>
                <div class="menu-text">
                    <h3>إدارة الفريق</h3>
                    <p>التشكيلة والتكتيك</p>
                </div>
            </a>
            
            <a href="match.html" class="menu-btn">
                <div class="menu-icon">⚽</div>
                <div class="menu-text">
                    <h3>المباراة التالية</h3>
                    <p id="nextMatch">جارٍ التحميل...</p>
                </div>
            </a>
            
            <a href="league.html" class="menu-btn">
                <div class="menu-icon">📊</div>
                <div class="menu-text">
                    <h3>جدول الترتيب</h3>
                    <p>متابعة المنافسة</p>
                </div>
            </a>
            
            <a href="transfers.html" class="menu-btn">
                <div class="menu-icon">💰</div>
                <div class="menu-text">
                    <h3>سوق الانتقالات</h3>
                    <p>تعاقدات جديدة</p>
                </div>
            </a>
        </div>
    </div>
    
    <script src="js/data.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
