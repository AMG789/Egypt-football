 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الترتيب - الدوري المصري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← رجوع</a>
        
        <div class="header">
            <h1>📊 جدول الترتيب</h1>
            <p>الموسم 2024-2025</p>
        </div>
        
        <div class="league-table" id="leagueTable">
            <div class="table-header">
                <div>#</div>
                <div>الفريق</div>
                <div>ل</div>
                <div>ف</div>
                <div>ت</div>
                <div>خ</div>
                <div>النقاط</div>
            </div>
            <div id="tableBody">
                <!-- يضاف بالـ JavaScript -->
            </div>
        </div>
        
        <div style="margin-top: 20px; text-align: center;">
            <button class="control-btn" onclick="resetSeason()">موسم جديد</button>
        </div>
    </div>
    
    <script src="js/data.js"></script>
    <script>
        const gameState = JSON.parse(localStorage.getItem('egyptianLeague'));
        
        if (!gameState) {
            window.location.href = 'index.html';
        }
        
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            // تحويل الجدول لمصفوفة
            const teams = Object.keys(gameState.table).map(key => {
                const team = TEAMS[key];
                const record = gameState.table[key];
                return {
                    id: key,
                    name: team ? team.name : key,
                    color: team ? team.color : '#666',
                    ...record
                };
            });
            
            // الترتيب حسب النقاط
            teams.sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                return (b.gf - b.ga) - (a.gf - a.ga);
            });
            
            // عرض الصفوف
            teams.forEach((team, index) => {
                const row = document.createElement('div');
                row.className = `table-row ${team.id === gameState.team ? 'user-team' : ''}`;
                
                row.innerHTML = `
                    <div class="pos">${index + 1}</div>
                    <div class="team-cell">
                        <div class="mini-logo" style="background: ${team.color}; color: #fff;">
                            ${team.name[0]}
                        </div>
                        ${team.name}
                    </div>
                    <div>${team.played}</div>
                    <div>${team.won}</div>
                    <div>${team.drawn}</div>
                    <div>${team.lost}</div>
                    <div class="pnts">${team.points}</div>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        function resetSeason() {
            if (confirm('بدء موسم جديد؟ سيتم إعادة جميع الإحصائيات!')) {
                gameState.matchNumber = 0;
                gameState.points = 0;
                gameState.played = [];
                gameState.table = {};
                
                // تهيئة الجدول
                Object.keys(TEAMS).forEach(key => {
                    gameState.table[key] = {
                        played: 0, won: 0, drawn: 0, lost: 0,
                        gf: 0, ga: 0, points: 0
                    };
                });
                
                localStorage.setItem('egyptianLeague', JSON.stringify(gameState));
                location.reload();
            }
        }
        
        renderTable();
    </script>
</body>
</html>
