 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الفريق - الدوري المصري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← رجوع</a>
        
        <div class="header">
            <h1>👥 إدارة الفريق</h1>
            <p id="teamName">جارٍ التحميل...</p>
        </div>
        
        <!-- اختيار التشكيلة -->
        <div class="formation-section">
            <h3>التشكيلة</h3>
            <div class="formation-tabs">
                <button class="formation-tab active" data-formation="4-3-3">4-3-3</button>
                <button class="formation-tab" data-formation="4-2-3-1">4-2-3-1</button>
                <button class="formation-tab" data-formation="3-5-2">3-5-2</button>
            </div>
        </div>
        
        <!-- اختيار التكتيك -->
        <div class="formation-section">
            <h3>التكتيك</h3>
            <div class="tactic-tabs">
                <button class="tactic-tab" data-tactic="attacking">هجومي</button>
                <button class="tactic-tab active" data-tactic="balanced">متوازن</button>
                <button class="tactic-tab" data-tactic="defensive">دفاعي</button>
            </div>
        </div>
        
        <!-- الملعب التكتيكي -->
        <div class="formation-section">
            <h3>التشكيلة على الملعب</h3>
            <div class="pitch" id="pitch">
                <div class="pitch-lines"></div>
                <!-- اللاعبين يضافون بالـ JavaScript -->
            </div>
        </div>
        
        <!-- قائمة اللاعبين -->
        <div class="formation-section">
            <h3>قائمة اللاعبين</h3>
            <div class="players-list" id="playersList">
                <!-- اللاعبين يضافون بالـ JavaScript -->
            </div>
        </div>
    </div>
    
    <script src="js/data.js"></script>
    <script>
        // تحميل بيانات اللعبة
        const gameState = JSON.parse(localStorage.getItem('egyptianLeague'));
        
        if (!gameState) {
            window.location.href = 'index.html';
        }
        
        const team = TEAMS[gameState.team];
        document.getElementById('teamName').textContent = team.name;
        
        // عرض اللاعبين
        function renderPlayers() {
            const list = document.getElementById('playersList');
            list.innerHTML = '';
            
            team.players.forEach((player, index) => {
                const isInLineup = gameState.lineup.includes(player.id);
                
                const div = document.createElement('div');
                div.className = `player-item ${isInLineup ? 'selected' : ''}`;
                div.innerHTML = `
                    <div class="player-info">
                        <h4>${player.name}</h4>
                        <span>${player.position} | ${player.rating} ⭐</span>
                    </div>
                    <div class="player-rating">${player.rating}</div>
                `;
                
                div.addEventListener('click', () => togglePlayer(player.id));
                list.appendChild(div);
            });
        }
        
        // تبديل اللاعب في التشكيلة
        function togglePlayer(playerId) {
            const index = gameState.lineup.indexOf(playerId);
            
            if (index > -1) {
                // إزالة من التشكيلة
                if (gameState.lineup.length > 11) {
                    gameState.lineup.splice(index, 1);
                }
            } else {
                // إضافة للتشكيلة
                if (gameState.lineup.length < 11) {
                    gameState.lineup.push(playerId);
                }
            }
            
            localStorage.setItem('egyptianLeague', JSON.stringify(gameState));
            renderPlayers();
            renderPitch();
        }
        
        // عرض الملعب
        function renderPitch() {
            const pitch = document.getElementById('pitch');
            const formation = FORMATIONS[gameState.formation];
            
            // إزالة اللاعبين القدامى
            pitch.querySelectorAll('.player-position').forEach(el => el.remove());
            
            // إضافة اللاعبين الجدد
            const positions = Object.keys(formation.positions);
            gameState.lineup.forEach((playerId, index) => {
                if (index >= positions.length) return;
                
                const player = team.players.find(p => p.id === playerId);
                if (!player) return;
                
                const pos = formation.positions[positions[index]];
                const div = document.createElement('div');
                div.className = 'player-position';
                div.style.top = pos.top;
                div.style.left = pos.left;
                div.style.transform = 'translate(-50%, -50%)';
                div.textContent = player.position;
                div.title = player.name;
                
                pitch.appendChild(div);
            });
        }
        
        // تغيير التشكيلة
        document.querySelectorAll('.formation-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.formation-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                gameState.formation = this.dataset.formation;
                localStorage.setItem('egyptianLeague', JSON.stringify(gameState));
                renderPitch();
            });
        });
        
        // تغيير التكتيك
        document.querySelectorAll('.tactic-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tactic-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                gameState.tactic = this.dataset.tactic;
                localStorage.setItem('egyptianLeague', JSON.stringify(gameState));
            });
        });
        
        // تحديد التشكيلة والتكتيك الحالي
        document.querySelector(`[data-formation="${gameState.formation}"]`).classList.add('active');
        document.querySelector(`[data-tactic="${gameState.tactic}"]`).classList.add('active');
        
        // التهيئة
        renderPlayers();
        renderPitch();
    </script>
</body>
</html>
